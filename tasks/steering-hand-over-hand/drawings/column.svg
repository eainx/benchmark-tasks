<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="960" viewBox="0 0 1450 960"><rect width="1450" height="960" fill="#fff"/><text x="40.0" y="40.0" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#111" font-weight="bold">STEERING TEST COLUMN — build drawing (all dimensions mm; steel unless stated)</text><text x="40.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Task: steering-hand-over-hand. Wheel centre 200 above bench, column raked 25° (wheel plane 65° from horizontal). Full lock ±450° (1.25 turns).</text><text x="60.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">VIEW A — side elevation (driver/robot on the right)</text><line x1="44.0" y1="560.0" x2="584.0" y2="560.0" stroke="#111" stroke-width="2.0"/><text x="503" y="573" font-size="10" font-family="Helvetica">bench top</text><polygon points="80.0,560.0 404.0,560.0 404.0,551.0 80.0,551.0" fill="#ddd" stroke="#111" stroke-width="1.4"/><polygon points="316.6,378.4 71.9,492.5 94.8,541.4 339.5,427.3" fill="#eee" stroke="#111" stroke-width="1.4"/><line x1="409.6" y1="364.8" x2="34.4" y2="539.7" stroke="#06c" stroke-width="0.7" stroke-dasharray="8 4 2 4"/><line x1="340.6" y1="387.1" x2="55.1" y2="520.2" stroke="#333" stroke-width="0.8" stroke-dasharray="4 3"/><line x1="348.2" y1="403.4" x2="62.7" y2="536.5" stroke="#333" stroke-width="0.8" stroke-dasharray="4 3"/><polygon points="302.0,391.6 313.4,386.3 331.3,424.7 319.9,430.0" fill="#bbb" stroke="#111" stroke-width="0.8"/><polygon points="80.1,495.1 91.5,489.8 109.4,528.1 98.0,533.4" fill="#bbb" stroke="#111" stroke-width="0.8"/><polygon points="316.4,373.5 331.1,366.7 357.7,423.8 343.0,430.6" fill="#ccc" stroke="#111" stroke-width="1.4"/><line x1="333.3" y1="211.7" x2="477.8" y2="521.7" stroke="#222" stroke-width="3.0"/><line x1="344.4" y1="395.2" x2="359.9" y2="268.8" stroke="#111" stroke-width="1.0"/><line x1="344.4" y1="395.2" x2="451.2" y2="464.6" stroke="#111" stroke-width="1.0"/><line x1="310.9" y1="366.1" x2="345.2" y2="439.5" stroke="#e0a000" stroke-width="2.2"/><polygon points="183.2,551.0 228.2,551.0 228.2,489.7 183.2,489.7" fill="#ddd" stroke="#111" stroke-width="1.4"/><polygon points="32.5,446.3 42.3,441.7 95.6,555.9 85.8,560.5" fill="#cfe3ff" stroke="#111" stroke-width="1.4"/><circle cx="33.6" cy="465.6" r="4.0" fill="#888" stroke="#111" stroke-width="1.3"/><text x="39.5" y="335.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">gear / stop / spring plate</text><text x="39.5" y="346.7" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">(View B), at the lower end</text><line x1="80.0" y1="560.0" x2="80.0" y2="582.0" stroke="#555" stroke-width="0.6"/><line x1="404.0" y1="560.0" x2="404.0" y2="582.0" stroke="#555" stroke-width="0.6"/><line x1="80.0" y1="582.0" x2="404.0" y2="582.0" stroke="#c22" stroke-width="0.8"/><polygon points="80.0,582.0 87.0,585.0 87.0,579.0" fill="#c22" stroke="#c22" stroke-width="0.5"/><polygon points="404.0,582.0 397.0,579.0 397.0,585.0" fill="#c22" stroke="#c22" stroke-width="0.5"/><text x="242.0" y="599.2" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#c22">360 base plate (×220 wide ×10)</text><line x1="377.0" y1="560.0" x2="417.0" y2="560.0" stroke="#555" stroke-width="0.6"/><line x1="377.0" y1="380.0" x2="417.0" y2="380.0" stroke="#555" stroke-width="0.6"/><line x1="417.0" y1="560.0" x2="417.0" y2="380.0" stroke="#c22" stroke-width="0.8"/><polygon points="417.0,560.0 420.0,553.0 414.0,553.0" fill="#c22" stroke="#c22" stroke-width="0.5"/><polygon points="417.0,380.0 414.0,387.0 420.0,387.0" fill="#c22" stroke="#c22" stroke-width="0.5"/><text x="441.0" y="474.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#c22">200</text><line x1="316.6" y1="378.4" x2="309.0" y2="362.0" stroke="#555" stroke-width="0.6"/><line x1="71.9" y1="492.5" x2="64.3" y2="476.1" stroke="#555" stroke-width="0.6"/><line x1="309.0" y1="362.0" x2="64.3" y2="476.1" stroke="#c22" stroke-width="0.8"/><polygon points="309.0,362.0 301.4,362.3 304.0,367.7" fill="#c22" stroke="#c22" stroke-width="0.5"/><polygon points="64.3,476.1 72.0,475.9 69.4,470.5" fill="#c22" stroke="#c22" stroke-width="0.5"/><text x="182.1" y="413.3" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#c22">300 column tube Ø60×3</text><text x="448.8" y="406.1" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start" fill="#c22">25°</text><line x1="377.0" y1="380.0" x2="485.0" y2="380.0" stroke="#c22" stroke-width="0.6" stroke-dasharray="3 3"/><text x="413.0" y="186.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">Ø380 wheel (edge-on)</text><text x="234.5" y="495.2" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">50×50×3 SHS post,</text><text x="234.5" y="506.9" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">welded to base,</text><text x="234.5" y="518.6" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">saddle clamp to tube</text><text x="80.0" y="612.2" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">Base: 4× M8 bolts or G-clamps to the bench.</text><text x="80.0" y="625.7" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">Column: 2× 6204-2RS bearings (20×47×14) pressed in end bushes; Ø20 shaft;</text><text x="80.0" y="639.2" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">6-bolt hub adapter on the top end; 20T pinion keyed on the lower end</text><text x="325.9" y="334.3" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">protractor ring (360°, Ø90) on shroud face</text><text x="700.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">VIEW B — gear, stop and centring-spring plate (seen along the column, wheel straight ahead)</text><text x="700.0" y="118.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Wheel shaft drives the stop gear 4:1 down, so ±450° at the wheel is ±112.5° at the stop gear.</text><polygon points="753.5,457.5 1085.0,457.5 1085.0,177.0 753.5,177.0" fill="#eef4ff" stroke="#111" stroke-width="1.4"/><circle cx="830.0" cy="330.0" r="25.5" fill="#ccc" stroke="#111" stroke-width="1.3"/><circle cx="830.0" cy="330.0" r="17.0" fill="#fff" stroke="#111" stroke-width="1.3"/><text x="799.4" y="279.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="end" fill="#111">20T m1.5 pinion</text><text x="799.4" y="290.9" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="end" fill="#111">on Ø20 wheel shaft</text><circle cx="957.5" cy="330.0" r="102.0" fill="#e8e8e8" stroke="#111" stroke-width="1.3"/><circle cx="957.5" cy="330.0" r="10.2" fill="#fff" stroke="#111" stroke-width="1.3"/><text x="957.5" y="472.8" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">80T m1.5 stop gear (Ø120 pitch, 12 face)</text><circle cx="957.5" cy="245.0" r="6.8" fill="#c22" stroke="#111" stroke-width="1.3"/><text x="969.4" y="241.6" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">M8 stop pin, r50</text><line x1="879.0" y1="362.5" x2="844.4" y2="376.8" stroke="#555" stroke-width="3.0"/><circle cx="879.0" cy="362.5" r="6.8" fill="none" stroke="#c22" stroke-width="1" stroke-dasharray="2 2"/><text x="844.4" y="392.1" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="end" fill="#111">stop for right lock −450°</text><line x1="1036.0" y1="362.5" x2="1070.6" y2="376.8" stroke="#555" stroke-width="3.0"/><circle cx="1036.0" cy="362.5" r="6.8" fill="none" stroke="#c22" stroke-width="1" stroke-dasharray="2 2"/><text x="1070.6" y="392.1" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#111">stop for left lock +450°</text><text x="700.0" y="600.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Stop pin stands 15 proud of the gear face; the stop blocks sit on standoffs in front of the gear face.</text><text x="700.0" y="617.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">The gears reverse the turn: left at the wheel is clockwise here.</text><text x="700.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Stops: 2× M8×40 socket set screws + jam nuts in 20×20×30 steel blocks bolted to the 6 mm plate.</text><text x="700.0" y="577.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">1 mm of screw travel = 1.15° at the gear = 4.6° at the wheel. Set each to 450° ±5° at the wheel. Plate 195×165×6.</text><circle cx="957.5" cy="330.0" r="30.6" fill="none" stroke="#2a7" stroke-width="2.2"/><text x="960.9" y="381.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#2a7">centring spring (Ø36 coil)</text><line x1="952.4" y1="299.4" x2="947.3" y2="258.6" stroke="#2a7" stroke-width="2.0"/><line x1="962.6" y1="299.4" x2="967.7" y2="258.6" stroke="#2a7" stroke-width="2.0"/><circle cx="957.5" cy="262.0" r="5.1" fill="#2a7" stroke="#111" stroke-width="1.3"/><text x="971.1" y="265.4" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#2a7">spring pin r40</text><text x="971.1" y="277.3" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#2a7">(+ fixed pin on the plate</text><text x="971.1" y="289.2" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#2a7">behind it, same place)</text><text x="972.8" y="335.1" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">Ø12 stub shaft, 2× 6001-2RS</text><line x1="830.0" y1="445.6" x2="830.0" y2="445.6" stroke="#555" stroke-width="0.6"/><line x1="957.5" y1="445.6" x2="957.5" y2="445.6" stroke="#555" stroke-width="0.6"/><line x1="830.0" y1="445.6" x2="957.5" y2="445.6" stroke="#c22" stroke-width="0.8"/><polygon points="830.0,445.6 837.0,448.6 837.0,442.6" fill="#c22" stroke="#c22" stroke-width="0.5"/><polygon points="957.5,445.6 950.5,442.6 950.5,448.6" fill="#c22" stroke="#c22" stroke-width="0.5"/><text x="893.8" y="449.6" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#c22">75 centres</text><text x="40.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold">CENTRING SPRING (double-acting 'scissor' return, as on throttle and joystick returns)</text><text x="40.0" y="692.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Double-leg torsion spring on the stop-gear stub shaft (over a Ø30 bush): music wire Ø4.5, mean coil Ø36, 11 active coils, straight legs 60, legs crossed.</text><text x="40.0" y="709.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Both legs straddle the spring pin on the gear (r40) and a fixed pin on the plate at the same place; turning either way, one leg is carried</text><text x="40.0" y="726.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">and the other held, so the spring always winds up and pulls the wheel back to straight ahead.</text><text x="40.0" y="743.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Rate at the stop gear 3.3 N·m/rad (6.4 N·m at 112.5°)  →  at the wheel 3.3/16 = 0.20 N·m/rad: 1.6 N·m at 450° = 8.4 N on the 190 mm rim radius.</text><text x="40.0" y="760.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Bending stress at 6.4 N·m: 32M/πd³ × 1.1 = 0.79 GPa (music wire allowable ≈ 1.4 GPa).</text><text x="40.0" y="777.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">Tooth load at the stop: a 30 N push on the rim (5.7 N·m) gives 23 N·m at the gear = 380 N tooth force: well within a steel m1.5 × 12 gear.</text><text x="40.0" y="794.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111"></text><text x="40.0" y="811.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="bold">COMMISSIONING CHECKS (record in the trial sheet)</text><text x="40.0" y="828.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">1. Spring scale hooked on the rim at 9 o'clock, pulled tangentially at full lock: 8.4 N ± 1 N (adjust the spring-pin radius 36–44 if needed).</text><text x="40.0" y="845.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">2. Turn the wheel 90° left and let go: it returns within 10° of the tape-mark straight-ahead position (otherwise reduce gear/bearing drag).</text><text x="40.0" y="862.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">3. Turn to each lock: the yellow tape reads 450° ± 5° on the protractor ring (adjust the stop screw, lock the jam nut).</text><text x="40.0" y="879.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#111">4. Free play at the rim with both pins seated: under 5 mm.</text></svg>